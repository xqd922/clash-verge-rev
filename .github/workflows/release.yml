name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.7.7-legacy.r2). The tag must already be pushed."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_id: ${{ steps.create.outputs.release_id }}
      is_prerelease: ${{ steps.create.outputs.is_prerelease }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::tag must start with v, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate version
        id: resolve
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .package.version src-tauri/tauri.conf.json)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$TAURI" ]; then
            echo "::error::version mismatch: tag=$VERSION package.json=$PKG tauri.conf.json=$TAURI"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: pnpm release-notes "${{ steps.tag.outputs.tag }}" --out release_notes.md

      - name: Create or refresh draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-legacy\.r[0-9]+)?$ ]]; then
            IS_PRERELEASE=false
          else
            IS_PRERELEASE=true
          fi
          TITLE="Clash Verge Legacy $TAG"
          BODY="$(cat release_notes.md)"
          TARGET="$(git rev-parse HEAD)"
          ID=""
          if RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>/dev/null); then
            ID=$(jq -r .id <<< "$RELEASE_JSON")
          fi
          if [ -z "$ID" ]; then
            RELEASES_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
            ID=$(jq -r --arg title "$TITLE" '.[] | select(.draft == true and .name == $title) | .id' <<< "$RELEASES_JSON" | head -n 1)
          fi
          if [ -n "$ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/$ID" \
              -X PATCH \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease="$IS_PRERELEASE" >/dev/null
          else
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -X POST \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease="$IS_PRERELEASE" \
              --jq .id)
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@1.77.0

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }}

      - name: Upload macOS assets
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          retry_upload() {
            for attempt in 1 2 3; do
              "$@" && return 0
              code=$?
              if [ "$attempt" -eq 3 ]; then
                return "$code"
              fi
              echo "::warning::asset upload attempt $attempt failed with exit code $code; retrying"
              sleep $((attempt * 20))
            done
          }
          retry_upload pnpm upload-release-assets \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows assets
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          retry_upload() {
            for attempt in 1 2 3; do
              "$@" && return 0
              code=$?
              if [ "$attempt" -eq 3 ]; then
                return "$code"
              fi
              echo "::warning::asset upload attempt $attempt failed with exit code $code; retrying"
              sleep $((attempt * 20))
            done
          }
          retry_upload pnpm upload-release-assets \
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

      - name: Portable Bundle
        if: matrix.os == 'windows-latest'
        run: |
          pnpm portable ${{ matrix.target }}
          $archByTarget = @{
            "x86_64-pc-windows-msvc" = "x64"
            "i686-pc-windows-msvc" = "x86"
            "aarch64-pc-windows-msvc" = "arm64"
          }
          $arch = $archByTarget["${{ matrix.target }}"]
          $zip = "Clash.Verge.Legacy_${{ needs.preflight.outputs.version }}_${arch}_portable.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm upload-release-assets $zip
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Write-Warning "portable upload attempt $attempt failed with exit code $LASTEXITCODE; retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}

  release-for-linux:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Build for Linux
        uses: ./.github/build-for-linux
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          target: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          retry_upload() {
            for attempt in 1 2 3; do
              "$@" && return 0
              code=$?
              if [ "$attempt" -eq 3 ]; then
                return "$code"
              fi
              echo "::warning::asset upload attempt $attempt failed with exit code $code; retrying"
              sleep $((attempt * 20))
            done
          }
          retry_upload pnpm upload-release-assets \
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb \
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  release-for-fixed-webview2:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            arch: x86
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check ${{ matrix.target }}

      - name: Download WebView2 Runtime
        run: |
          invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
          Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
          Remove-Item .\src-tauri\tauri.windows.conf.json
          Rename-Item .\src-tauri\webview2.${{ matrix.arch }}.json tauri.windows.conf.json

      - name: Tauri build
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }}

      - name: Rename
        run: |
          Rename-Item '.\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}-setup.exe' 'Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}_fixed_webview2-setup.exe'
          Rename-Item '.\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}-setup.nsis.zip' 'Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}_fixed_webview2-setup.nsis.zip'
          Rename-Item '.\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}-setup.nsis.zip.sig' 'Clash Verge Legacy_${{steps.build.outputs.appVersion}}_${{ matrix.arch }}_fixed_webview2-setup.nsis.zip.sig'

      - name: Upload assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          retry_upload() {
            for attempt in 1 2 3; do
              "$@" && return 0
              code=$?
              if [ "$attempt" -eq 3 ]; then
                return "$code"
              fi
              echo "::warning::asset upload attempt $attempt failed with exit code $code; retrying"
              sleep $((attempt * 20))
            done
          }
          retry_upload pnpm upload-release-assets \
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

      - name: Portable Bundle
        run: |
          pnpm portable-fixed-webview2 ${{ matrix.target }}
          $zip = "Clash.Verge.Legacy_${{ needs.preflight.outputs.version }}_${{ matrix.arch }}_fixed_webview2_portable.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm upload-release-assets $zip
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Write-Warning "fixed webview2 portable upload attempt $attempt failed with exit code $LASTEXITCODE; retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}

  publish-release:
    needs: [preflight, release, release-for-linux, release-for-fixed-webview2]
    runs-on: ubuntu-latest
    steps:
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ needs.preflight.outputs.release_id }}" \
            -X PATCH \
            -f tag_name="${{ needs.preflight.outputs.tag }}" \
            -F draft=false \
            -F prerelease="${{ needs.preflight.outputs.is_prerelease }}" >/dev/null

  release-update:
    runs-on: ubuntu-latest
    needs: [preflight, publish-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i

      - name: Release updater file
        run: pnpm updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update-for-fixed-webview2:
    runs-on: ubuntu-latest
    needs: [preflight, publish-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i

      - name: Release updater file
        run: pnpm updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-winget:
    if: false # disabled for fork release
    runs-on: ubuntu-latest
    needs: [release-update]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Version
        run: |
          sudo apt-get update
          sudo apt-get install jq
          echo "VERSION=$(cat package.json | jq '.version' | tr -d '"')" >> $GITHUB_ENV
      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ClashVergeRev.ClashVergeRev
          version: ${{env.VERSION}}
          release-tag: v${{env.VERSION}}
          installers-regex: '_(arm64|x64|x86)-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN  }}
