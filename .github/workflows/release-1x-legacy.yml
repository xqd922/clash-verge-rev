name: Release 1.x Legacy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Legacy release tag (e.g., v7.0.24-legacy.1)"
        required: true
        default: "v7.0.24-legacy.1"
      release_name:
        description: "GitHub release title"
        required: true
        default: "Release 7.0.24 Legacy 1"
      overwrite_existing:
        description: "Delete the existing tag/release before publishing"
        required: true
        type: boolean
        default: true

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  RELEASE_TAG: ${{ github.event.inputs.tag }}
  RELEASE_NAME: ${{ github.event.inputs.release_name }}
  LEGACY_PRODUCT_NAME: "Clash Verge Rev Legacy"
  LEGACY_IDENTIFIER: "io.github.xqd922.clash-verge-rev-legacy"
  LEGACY_UPDATER_TAG: "updater-legacy"

jobs:
  release:
    name: Build and Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: release/1.x-legacy

      - name: Validate legacy release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-legacy\.[0-9]+$ ]]; then
            echo "Legacy release tag expected, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Delete existing release and tag
        if: ${{ github.event.inputs.overwrite_existing == 'true' }}
        shell: bash
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag -y || true
          git push origin ":refs/tags/$RELEASE_TAG" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "release-1x-legacy-upgraded-rust-v4"
          key: "${{ matrix.os }}-${{ matrix.target }}"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Prepare legacy release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          const releaseTag = process.env.RELEASE_TAG
          const version = releaseTag.replace(/^v/, '')
          const productName = process.env.LEGACY_PRODUCT_NAME
          const identifier = process.env.LEGACY_IDENTIFIER
          const updaterTag = process.env.LEGACY_UPDATER_TAG
          const repo = `${process.env.GITHUB_REPOSITORY}`

          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'))
          const writeJson = (file, data) => {
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`)
          }

          const packageJson = readJson('package.json')
          packageJson.name = 'clash-verge-legacy'
          packageJson.version = version
          writeJson('package.json', packageJson)

          let cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
          cargoToml = cargoToml.replace(/^version = ".*"$/m, `version = "${version}"`)
          cargoToml = cargoToml.replace(/^repository = ".*"$/m, `repository = "https://github.com/${repo}.git"`)
          cargoToml = cargoToml.replace(/^identifier = ".*"$/m, `identifier = "${identifier}"`)
          fs.writeFileSync('src-tauri/Cargo.toml', cargoToml)

          let cargoLock = fs.readFileSync('Cargo.lock', 'utf8')
          cargoLock = cargoLock.replace(
            /(name = "clash-verge"\r?\nversion = ")[^"]+(")/,
            `$1${version}$2`,
          )
          fs.writeFileSync('Cargo.lock', cargoLock)

          const tauriConfig = readJson('src-tauri/tauri.conf.json')
          tauriConfig.version = version
          tauriConfig.productName = productName
          tauriConfig.identifier = identifier
          tauriConfig.bundle = {
            ...tauriConfig.bundle,
            publisher: 'xqd922',
          }
          tauriConfig.plugins = {
            ...tauriConfig.plugins,
            updater: {
              ...tauriConfig.plugins.updater,
              endpoints: [
                `https://github.com/${repo}/releases/download/${updaterTag}/update.json`,
              ],
            },
          }
          writeJson('src-tauri/tauri.conf.json', tauriConfig)

          for (const file of [
            'src-tauri/tauri.windows.conf.json',
            'src-tauri/webview2.x64.json',
            'src-tauri/webview2.x86.json',
            'src-tauri/webview2.arm64.json',
          ]) {
            const config = readJson(file)
            config.identifier = identifier
            if (config.plugins?.updater) {
              config.plugins.updater.endpoints = [
                `https://github.com/${repo}/releases/download/${updaterTag}/update-fixed-webview2.json`,
              ]
            }
            writeJson(file, config)
          }

          console.log(JSON.stringify({ releaseTag, version, productName, identifier, updaterTag }, null, 2))
          NODE

      - name: Extract release notes from Changelog
        id: changelog
        shell: bash
        run: |
          awk '/^## v\(/{if(found) exit; found=1} found{print}' Changelog.md > release_notes.md
          {
            echo "notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          updaterJsonKeepUniversal: true

      - name: Portable Bundle
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $configDir = Join-Path $releaseDir ".config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          Set-Content -Path (Join-Path $configDir "PORTABLE") -Value ""

          $sourceExe = Join-Path $releaseDir "clash-verge.exe"
          $legacyExe = Join-Path $releaseDir "${{ env.LEGACY_PRODUCT_NAME }}.exe"
          Copy-Item $sourceExe $legacyExe -Force

          $version = "${{ env.RELEASE_TAG }}".TrimStart("v")
          $zipFile = "Clash.Verge.Rev.Legacy_${version}_${{ matrix.arch }}_portable.zip"

          Compress-Archive -Path @(
            $legacyExe,
            (Join-Path $releaseDir "verge-mihomo.exe"),
            (Join-Path $releaseDir "verge-mihomo-alpha.exe"),
            (Join-Path $releaseDir "verge-mihomo-smart.exe"),
            (Join-Path $releaseDir "resources"),
            $configDir
          ) -DestinationPath $zipFile -Force

          Write-Host "Created legacy portable zip: $zipFile"

      - name: Prepare legacy updater files
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --pattern "latest.json" --output "update.json" --clobber
          node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('update.json', 'utf8'))
          data.notes = fs.readFileSync('release_notes.md', 'utf8')
          fs.writeFileSync('update.json', `${JSON.stringify(data, null, 2)}\n`)

          const proxy = JSON.parse(JSON.stringify(data))
          for (const platform of Object.values(proxy.platforms || {})) {
            if (platform.url) {
              platform.url = `https://update.hwdns.net/${platform.url}`
            }
          }
          fs.writeFileSync('update-proxy.json', `${JSON.stringify(proxy, null, 2)}\n`)
          NODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable to legacy release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "Clash.Verge.Rev.Legacy_${version}_${{ matrix.arch }}_portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater files to legacy updater release
        shell: bash
        run: |
          gh release view "$LEGACY_UPDATER_TAG" >/dev/null 2>&1 || \
            gh release create "$LEGACY_UPDATER_TAG" --title "Legacy updater assets" --notes "Legacy updater assets"
          gh release upload "$LEGACY_UPDATER_TAG" update.json update-proxy.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
