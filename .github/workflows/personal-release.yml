name: Personal Release (personal)

on:
  push:
    tags:
      - "v*.*.*"

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  check_personal_tag:
    name: Check Personal Tag and Version Consistency
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate personal branch tag
        id: validate
        shell: bash
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")

          git fetch origin personal --depth=1
          PERSONAL_HEAD=$(git rev-parse origin/personal)

          echo "Current tag: $TAG_REF"
          echo "Tag commit: $TAG_COMMIT"
          echo "origin/personal: $PERSONAL_HEAD"

          if [[ "$TAG_COMMIT" != "$PERSONAL_HEAD" ]]; then
            echo "Tag $TAG_REF must point to the latest commit on origin/personal."
            exit 1
          fi

          PKG_VERSION=$(jq -r .version package.json)
          EXPECTED_TAG="v$PKG_VERSION"

          if [[ "$TAG_REF" != "$EXPECTED_TAG" ]]; then
            echo "Version mismatch:"
            echo "  tag         : $TAG_REF"
            echo "  package.json: $EXPECTED_TAG"
            exit 1
          fi

          {
            echo "tag_name=$TAG_REF"
            echo "version=$PKG_VERSION"
            if [[ "$PKG_VERSION" == *-* ]]; then
              echo "is_prerelease=true"
            else
              echo "is_prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and Release
    needs: [check_personal_tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "personal-rust-v3"
          key: "${{ matrix.os }}-${{ matrix.target }}"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Extract release notes from Changelog
        id: changelog
        shell: bash
        run: |
          # Extract content from first "## v(" to the next "## v(" (exclusive)
          awk '/^## v\(/{if(found) exit; found=1} found{print}' Changelog.md > release_notes.md
          echo "Extracted release notes:"
          cat release_notes.md
          {
            echo "notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.5
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check_personal_tag.outputs.tag_name }}
          releaseName: "Personal ${{ needs.check_personal_tag.outputs.tag_name }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ needs.check_personal_tag.outputs.is_prerelease == 'true' }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          updaterJsonKeepUniversal: true

      - name: Portable Bundle
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $configDir = Join-Path $releaseDir ".config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          Set-Content -Path (Join-Path $configDir "PORTABLE") -Value ""

          $version = "${{ needs.check_personal_tag.outputs.version }}"
          $zipFile = "Clash.Verge_${version}_x64_portable.zip"

          Compress-Archive -Path @(
            (Join-Path $releaseDir "clash-verge.exe"),
            (Join-Path $releaseDir "verge-mihomo.exe"),
            (Join-Path $releaseDir "verge-mihomo-alpha.exe"),
            (Join-Path $releaseDir "verge-mihomo-smart.exe"),
            (Join-Path $releaseDir "resources"),
            $configDir
          ) -DestinationPath $zipFile -Force

          Write-Host "Created portable zip: $zipFile"

      - name: Use tauri-generated latest.json as update.json
        shell: bash
        run: |
          gh release download "${{ needs.check_personal_tag.outputs.tag_name }}" --pattern "latest.json" --output "update.json" --clobber
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('update.json', 'utf8'));
            data.notes = fs.readFileSync('release_notes.md', 'utf8');
            fs.writeFileSync('update.json', JSON.stringify(data, null, 2));
          "
          echo "Final update.json:"
          cat update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_personal_tag.outputs.tag_name }}
          files: |
            Clash.Verge_${{ needs.check_personal_tag.outputs.version }}_x64_portable.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update.json to updater release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater
          files: update.json
          token: ${{ secrets.GITHUB_TOKEN }}
